name: Enable GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Enable Pages from main
        uses: actions/github-script@v7
        with:
          script: |
            const payload = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              build_type: "legacy",
              source: { branch: "main", path: "/" },
            };
            try {
              await github.rest.repos.createPagesSite(payload);
              core.info("GitHub Pages enabled from branch main.");
            } catch (error) {
              if (error.status === 409 || error.status === 422) {
                await github.rest.repos.updateInformationAboutPagesSite(payload);
                core.info("GitHub Pages already present; source set to main.");
              } else {
                throw error;
              }
            }
